<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Campus Suite</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://kit.fontawesome.com/6fa938cd98.js" crossorigin="anonymous"></script>
    <style>
        .coming-soon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
            text-align: center;
        }
        .coming-soon-icon {
            font-size: 80px;
            color: var(--secondary-color);
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <nav>
        <h1 class="logo">Campus Suite</h1>
        <ul id="sidemenu">
            <li><a href="main.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="modules.html">Modules</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li class="logout"><a href="registration.html"><i class="fa-solid fa-right-from-bracket"></i></a></li>
        </ul>
    </nav>

    <div class="coming-soon-container">
        <i class="fa-solid fa-person-digging coming-soon-icon"></i>
        <h1 class="sub-title" style="margin: 0;">Under Construction</h1>
        <p style="color: var(--text-light); font-size: 18px; margin-top: 10px;">
            We are working hard to bring this module to you soon!
        </p>
        <br>
        <a href="main.html" class="btn-fancy">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </div>
</body>
</html>
